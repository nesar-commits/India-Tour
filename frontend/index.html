<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India Tour</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B6E4F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <script>
      // Start downloading the first hero photo before React loads, on the homepage only.
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.type = "image/webp";
        l.fetchPriority = "high";
        l.setAttribute("imagesrcset", "/hero/taj-mahal-1280.webp 1280w, /hero/taj-mahal-1920.webp 1920w, /hero/taj-mahal-2560.webp 2560w");
        l.setAttribute("imagesizes", "(orientation: portrait) 150vh, 100vw");
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
